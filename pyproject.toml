[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csa"
version = "0.1.0"
description = "Personal utility package to accelerate analytical workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
